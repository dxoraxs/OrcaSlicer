# dxoraxs fork: build OrcaSlicer for macOS arm64 from dx/main and publish it as a release.
# Started by hand or by dx-sync-upstream after it merges a new upstream release.
name: dx build macOS arm64

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release with the built app'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dx-build-macos
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-14
      arch: arm64
    secrets: inherit

  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@v7
        with:
          name: OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: orca-dx
        run: |
          set -euo pipefail
          base=$(git describe --tags --abbrev=0 --match 'v*-mcp.*' --exclude '*-dx.*' HEAD)
          n=$(git rev-list --count "${base}..HEAD")
          version="${base}-dx.${n}"
          tar -xzf "OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}.tar.gz"
          mkdir dmg && cp -R OrcaSlicer/OrcaSlicer.app dmg/ && ln -s /Applications dmg/Applications
          dmg_name="OrcaSlicer_Mac_arm64_${version}.dmg"
          hdiutil create -volname "OrcaSlicer" -srcfolder dmg -ov -format UDZO "$dmg_name"
          notes=$(printf '**%s** (commit %s)\n\nOrcaSlicer %s (MaxEllis MCP build) plus the dxoraxs patches:\n\n%s\n\nInstall with printer-biqu scripts/install-orca-dx.sh (removes the download quarantine; the app is ad-hoc signed).' \
            "$version" "${GITHUB_SHA:0:9}" "$base" "$(git log --no-merges --format='- %s' "${base}..HEAD" -- src)")
          # One rolling release: the Actions token may not create tags in this fork, but it may
          # replace assets of an existing release. The tag was created once by hand.
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "release $RELEASE is missing: create it once with a personal token (see dx/README.md)" >&2; exit 1
          fi
          for old in $(gh release view "$RELEASE" --json assets -q '.assets[].name' | grep '^OrcaSlicer_Mac_arm64_' || true); do
            gh release delete-asset "$RELEASE" "$old" -y
          done
          gh release upload "$RELEASE" "$dmg_name"
          gh release edit "$RELEASE" --title "OrcaSlicer dx: $version" --notes "$notes" --latest
