# dxoraxs fork: once a day merge the newest MaxEllis release tag (v*-mcp.*) into dx/main and
# start the macOS build. A conflict, or an upstream change to workflow files (GITHUB_TOKEN
# may not push those), opens an issue instead: run dx/sync-upstream.sh locally then.
name: dx sync upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dx/main
          fetch-depth: 0
          filter: blob:none
      - name: Merge newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "dx-sync[bot]"
          git config user.email "dx-sync@users.noreply.github.com"
          git remote add upstream https://github.com/MaxEllis/OrcaSlicer.git
          git fetch -q --filter=blob:none upstream 'refs/tags/v*:refs/tags/v*'
          latest=$(git tag -l 'v*-mcp.*' --sort=-v:refname | grep -v -- '-dx\.' | head -1)
          echo "newest upstream release: $latest"
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "dx/main already contains $latest"; exit 0
          fi
          open_issue() {
            title="Upstream $latest needs a manual merge"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
              gh issue create --title "$title" --body "$1

          Merge locally: \`dx/sync-upstream.sh\` in the clone, resolve, push dx/main, then run the *dx build macOS arm64* workflow."
            fi
          }
          if ! git merge --no-edit "$latest"; then
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort
            open_issue "Merging $latest into dx/main conflicts in:
          $files"
            exit 0
          fi
          if ! git push origin dx/main "refs/tags/$latest"; then
            open_issue "Merged $latest cleanly, but the push was refused (it most likely changes .github/workflows, which the Actions token may not push)."
            exit 0
          fi
          gh workflow run dx-build-macos.yml --ref dx/main
          echo "merged $latest and started the macOS build"
